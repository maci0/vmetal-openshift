name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck libxml2-utils jq

      - name: Ansible deps
        run: |
          uv venv
          uv pip install ansible-core ansible-lint yamllint jinja2 pyyaml
          ./.venv/bin/ansible-galaxy collection install -r ansible/requirements.yml

      - name: make lint
        run: make lint
