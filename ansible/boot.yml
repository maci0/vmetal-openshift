---
# Control cluster nodes through the emulated Redfish BMC (sushy-emulator).
# This is the BMC path used in enterprise/automated installs (and for Day-2):
# power the nodes and, for boot_via=redfish / IPI, mount the discovery ISO as
# virtual media instead of attaching it to the VM directly.
#
#   ansible-playbook boot.yml -e cluster=cluster0 -e bmc_action=on
#   actions: status | on | off | reset | media-insert | media-eject | boot-iso
#
# media-insert / boot-iso need the ISO served over HTTP. From the repo root:
#   python -m http.server 8080
# then pass -e iso_base_url=http://<host-on-oob-lan>:8080
- name: Redfish power / virtual media control
  hosts: local
  gather_facts: false
  become: false
  vars:
    cluster: cluster0
    bmc_action: status
    iso_base_url: ""
  tasks:
    - name: Validate cluster definitions
      ansible.builtin.import_tasks: tasks/validate.yml

    - name: Build topology from addressing scheme
      ansible.builtin.set_fact:
        topology: "{{ lookup('template', 'templates/topology.yml.j2') | from_yaml }}"

    - name: Select target cluster
      ansible.builtin.set_fact:
        tgt: "{{ topology | selectattr('name', 'equalto', cluster) | first }}"

    - name: Insert discovery ISO as virtual media
      community.general.redfish_command:
        category: Manager
        command: VirtualMediaInsert
        baseuri: "{{ tgt.bmc_host | default(tgt.machine_gateway) }}:{{ sushy_port }}"
        username: "{{ tgt.bmc_user }}"
        password: "{{ tgt.bmc_pass }}"
        validate_certs: false
        resource_id: "{{ item.uuid }}"
        virtual_media:
          image_url: "{{ iso_base_url }}/discovery_image_{{ cluster }}.iso"
          media_types: [CD, DVD]
      loop: "{{ tgt.nodes }}"
      loop_control:
        label: "{{ item.fullname }}"
      when: bmc_action in ['media-insert', 'boot-iso']

    - name: Eject virtual media
      community.general.redfish_command:
        category: Manager
        command: VirtualMediaEject
        baseuri: "{{ tgt.bmc_host | default(tgt.machine_gateway) }}:{{ sushy_port }}"
        username: "{{ tgt.bmc_user }}"
        password: "{{ tgt.bmc_pass }}"
        validate_certs: false
        resource_id: "{{ item.uuid }}"
      loop: "{{ tgt.nodes }}"
      loop_control:
        label: "{{ item.fullname }}"
      when: bmc_action == 'media-eject'

    - name: Set one-time boot to CD
      community.general.redfish_command:
        category: Systems
        command: SetOneTimeBoot
        baseuri: "{{ tgt.bmc_host | default(tgt.machine_gateway) }}:{{ sushy_port }}"
        username: "{{ tgt.bmc_user }}"
        password: "{{ tgt.bmc_pass }}"
        validate_certs: false
        resource_id: "{{ item.uuid }}"
        bootdevice: "Cd"
      loop: "{{ tgt.nodes }}"
      loop_control:
        label: "{{ item.fullname }}"
      when: bmc_action == 'boot-iso'

    - name: Power / reset nodes
      community.general.redfish_command:
        category: Systems
        command: "{{ {'on': 'PowerOn', 'off': 'PowerForceOff', 'reset': 'PowerGracefulRestart', 'boot-iso': 'PowerOn'}[bmc_action] }}"
        baseuri: "{{ tgt.bmc_host | default(tgt.machine_gateway) }}:{{ sushy_port }}"
        username: "{{ tgt.bmc_user }}"
        password: "{{ tgt.bmc_pass }}"
        validate_certs: false
        resource_id: "{{ item.uuid }}"
      loop: "{{ tgt.nodes }}"
      loop_control:
        label: "{{ item.fullname }}"
      when: bmc_action in ['on', 'off', 'reset', 'boot-iso']

    - name: Query power state (Redfish System)
      ansible.builtin.uri:
        url: "https://{{ tgt.bmc_host | default(tgt.machine_gateway) }}:{{ sushy_port }}/redfish/v1/Systems/{{ item.uuid }}"
        method: GET
        user: "{{ tgt.bmc_user }}"
        password: "{{ tgt.bmc_pass }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      loop: "{{ tgt.nodes }}"
      loop_control:
        label: "{{ item.fullname }}"
      register: rf
      when: bmc_action == 'status'

    - name: Show power state
      ansible.builtin.debug:
        msg: "{{ item.item.fullname }}: {{ item.json.PowerState | default('unknown') }}"
      loop: "{{ rf.results | default([]) }}"
      loop_control:
        label: "{{ item.item.fullname }}"
      when: bmc_action == 'status'
