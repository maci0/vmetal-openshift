---
# Tear down every cluster in `clusters`: destroy/undefine VMs, remove their
# volumes, and remove their networks. Scoped strictly to the derived topology,
# unrelated libvirt networks/domains/volumes are never touched.
#
#   ansible-playbook cleanup.yml
#
- name: Tear down virtual baremetal OCP lab
  hosts: local
  gather_facts: false
  become: "{{ use_become | default(true) }}"

  tasks:
    - name: Build topology from addressing scheme
      ansible.builtin.set_fact:
        topology: "{{ lookup('template', 'templates/topology.yml.j2') | from_yaml }}"

    # Install nodes AND day-2 workers, so `make down` removes everything.
    - name: Collect all domains (nodes + day-2 workers)
      ansible.builtin.set_fact:
        all_nodes: "{{ (topology | map(attribute='nodes') | flatten) + (topology | map(attribute='day2_workers') | flatten) }}"

    - name: Check which domains exist
      ansible.builtin.command: "virsh -c {{ libvirt_uri }} domstate {{ item.fullname }}"
      loop: "{{ all_nodes }}"
      loop_control:
        label: "{{ item.fullname }}"
      register: domstate
      changed_when: false
      failed_when: false

    - name: Destroy running domains
      ansible.builtin.command: "virsh -c {{ libvirt_uri }} destroy {{ item.item.fullname }}"
      loop: "{{ domstate.results }}"
      loop_control:
        label: "{{ item.item.fullname }}"
      when: item.rc == 0 and 'running' in item.stdout
      changed_when: true
      failed_when: false

    - name: Undefine domains (with nvram + storage)
      ansible.builtin.command: >-
        virsh -c {{ libvirt_uri }} undefine {{ item.item.fullname }}
        --nvram --remove-all-storage
      loop: "{{ domstate.results }}"
      loop_control:
        label: "{{ item.item.fullname }}"
      when: item.rc == 0
      changed_when: true
      failed_when: false

    - name: Check which volumes remain
      ansible.builtin.command: >-
        virsh -c {{ libvirt_uri }} vol-info --pool {{ storage_pool }}
        {{ item.0.fullname }}-{{ item.1.suffix }}.qcow2
      loop: "{{ all_nodes | subelements('disks') }}"
      loop_control:
        label: "{{ item.0.fullname }}-{{ item.1.suffix }}"
      register: voldel_info
      changed_when: false
      failed_when: false

    - name: Delete leftover volumes
      ansible.builtin.command: >-
        virsh -c {{ libvirt_uri }} vol-delete --pool {{ storage_pool }}
        {{ item.item.0.fullname }}-{{ item.item.1.suffix }}.qcow2
      loop: "{{ voldel_info.results }}"
      loop_control:
        label: "{{ item.item.0.fullname }}-{{ item.item.1.suffix }}"
      when: item.rc == 0
      changed_when: true
      failed_when: false

    - name: Destroy and undefine networks
      community.libvirt.virt_net:
        name: "{{ item.1.name }}"
        state: absent
        uri: "{{ libvirt_uri }}"
      loop: "{{ topology | subelements('networks') }}"
      loop_control:
        label: "{{ item.1.name }}"
