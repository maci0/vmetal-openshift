---
# Tear down every cluster in `clusters`: destroy/undefine VMs, remove their
# volumes, and remove their networks. Scoped strictly to the derived topology,
# unrelated libvirt networks/domains/volumes are never touched.
#
#   ansible-playbook cleanup.yml
#
- name: Tear down virtual baremetal OCP lab
  hosts: local
  gather_facts: false
  become: "{{ use_become | default(true) }}"

  tasks:
    - name: Build topology from addressing scheme
      ansible.builtin.set_fact:
        topology: "{{ lookup('template', '../templates/topology.yml.j2') | from_yaml }}"

    # Install nodes AND day-2 workers, so `make down` removes everything.
    - name: Collect all domains (nodes + day-2 workers)
      ansible.builtin.set_fact:
        all_nodes: "{{ (topology | map(attribute='nodes') | flatten) + (topology | map(attribute='day2_workers') | flatten) }}"

    - name: Check each domain's state (fails cleanly when undefined)
      community.libvirt.virt:
        command: status
        name: "{{ item.fullname }}"
        uri: "{{ libvirt_uri }}"
      loop: "{{ all_nodes }}"
      loop_control:
        label: "{{ item.fullname }}"
      register: domstate
      changed_when: false
      failed_when: false

    - name: Destroy running domains
      community.libvirt.virt:
        name: "{{ item.item.fullname }}"
        state: destroyed
        uri: "{{ libvirt_uri }}"
      loop: "{{ domstate.results }}"
      loop_control:
        label: "{{ item.item.fullname }}"
      when: (item.status | default('')) == 'running'
      register: dom_destroy
      # Ignore "not found" races; surface real libvirt/permission errors.
      failed_when: >-
        dom_destroy is failed and
        ('not found' not in (dom_destroy.msg | default('') | lower)) and
        ('no domain' not in (dom_destroy.msg | default('') | lower))

    # flags nvram + delete_volumes = `virsh undefine --nvram --remove-all-storage`:
    # removes the domain, its UEFI nvram, and all its qcow2 volumes in one go.
    - name: Undefine domains (with nvram + storage)
      community.libvirt.virt:
        command: undefine
        name: "{{ item.item.fullname }}"
        flags:
          - nvram
          - delete_volumes
        uri: "{{ libvirt_uri }}"
      loop: "{{ domstate.results }}"
      loop_control:
        label: "{{ item.item.fullname }}"
      when: item.status is defined   # status key present only for domains that exist
      register: dom_undefine
      failed_when: >-
        dom_undefine is failed and
        ('not found' not in (dom_undefine.msg | default('') | lower)) and
        ('no domain' not in (dom_undefine.msg | default('') | lower))

    - name: Destroy and undefine networks
      community.libvirt.virt_net:
        name: "{{ item.1.name }}"
        state: absent
        uri: "{{ libvirt_uri }}"
      loop: "{{ topology | subelements('networks') }}"
      loop_control:
        label: "{{ item.1.name }}"

    # Drop host split-DNS drop-ins written by host-dns.yml (best-effort; root needed).
    - name: Remove host NetworkManager dnsmasq drop-ins
      ansible.builtin.file:
        path: "/etc/NetworkManager/dnsmasq.d/ocp-{{ item.name }}.conf"
        state: absent
      loop: "{{ topology }}"
      loop_control:
        label: "{{ item.name }}"
      failed_when: false
      notify: Reload NetworkManager

  handlers:
    - name: Reload NetworkManager
      ansible.builtin.service:
        name: NetworkManager
        state: reloaded
      failed_when: false
