---
# Render install configs per cluster from the derived topology. No libvirt, no
# root. Output: clusters/<name>/.
#   agent clusters -> install-config.yaml (agent flavor) + agent-config.yaml
#                     + baremetalhosts.yaml (Day-2 BMC adoption)
#   ipi clusters   -> install-config.yaml (baremetal hosts[] with BMC)
#
#   ansible-playbook generate-configs.yml
#   ansible-playbook generate-configs.yml -e ssh_key_file=~/.ssh/id_rsa.pub
- name: Generate OpenShift install configs
  hosts: local
  gather_facts: false
  become: false
  vars:
    pull_secret_file: "{{ playbook_dir }}/../../pull-secret.json"
    ssh_key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"
    out_dir: "{{ playbook_dir }}/../../clusters"
    day2_storage_manifests:
      - lvms-operator.yaml.j2
      - lvms-cluster.yaml.j2
      - nfs-ganesha.yaml.j2
      - cnv-operator.yaml.j2
      - cnv-migration-network.yaml.j2
      - cnv-hyperconverged.yaml.j2
      - mtv-operator.yaml.j2
      - mtv-forkliftcontroller.yaml.j2

  tasks:
    - name: Validate cluster definitions
      ansible.builtin.import_tasks: ../tasks/validate.yml

    - name: Build topology from addressing scheme
      ansible.builtin.set_fact:
        topology: "{{ lookup('template', '../templates/topology.yml.j2') | from_yaml }}"

    - name: Ensure per-cluster output dirs exist
      ansible.builtin.file:
        path: "{{ out_dir }}/{{ item.name }}"
        state: directory
        mode: "0755"
      loop: "{{ topology }}"
      loop_control:
        label: "{{ item.name }}"

    # The 'none'/'baremetal' install-config flavour serves both agent and upi
    # (upi is platform: none; single- or multi-node). IPI has its own template below.
    - name: Render install-config.yaml (agent + upi)
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/install/install-config.yaml.j2"
        dest: "{{ out_dir }}/{{ item.name }}/install-config.yaml"
        mode: "0600"
      loop: "{{ topology }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        cluster: "{{ item }}"
      when: item.mode in ['agent', 'upi']

    - name: Render agent-config.yaml
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/install/agent-config.yaml.j2"
        dest: "{{ out_dir }}/{{ item.name }}/agent-config.yaml"
        mode: "0600"
      loop: "{{ topology }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        cluster: "{{ item }}"
      when: item.mode == 'agent'

    - name: Ensure openshift/ manifests dir for schedulable-masters clusters
      ansible.builtin.file:
        path: "{{ out_dir }}/{{ item.name }}/openshift"
        state: directory
        mode: "0755"
      loop: "{{ topology }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.mode == 'agent' and item.masters_schedulable and item.worker_replicas | int > 0

    - name: Render Scheduler manifest (masters schedulable with workers)
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/install/scheduler.yaml.j2"
        dest: "{{ out_dir }}/{{ item.name }}/openshift/cluster-scheduler-02-config.yml"
        mode: "0644"
      loop: "{{ topology }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        cluster: "{{ item }}"
      when: item.mode == 'agent' and item.masters_schedulable and item.worker_replicas | int > 0

    - name: Render BareMetalHost manifests (Day-2 BMC adoption)
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/install/baremetalhosts.yaml.j2"
        dest: "{{ out_dir }}/{{ item.name }}/baremetalhosts.yaml"
        mode: "0600"
      loop: "{{ topology }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        cluster: "{{ item }}"
      when: item.mode in ['agent', 'upi']

    # IPI creates metal3 + BareMetalHosts during install, so the Provisioning CR
    # is a Day-2 artifact for agent and upi baremetal clusters (>= 3 nodes).
    - name: Render metal3 Provisioning CR (agent/upi Day-2 adoption)
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/install/provisioning.yaml.j2"
        dest: "{{ out_dir }}/{{ item.name }}/provisioning.yaml"
        mode: "0644"
      loop: "{{ topology }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        cluster: "{{ item }}"
      when: not item.sno and item.mode in ['agent', 'upi']

    - name: Render MetalLB operator + L2 + BGP config (Day-2 LoadBalancer services)
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/install/{{ item.1 }}"
        dest: "{{ out_dir }}/{{ item.0.name }}/{{ item.1 | replace('.j2', '') }}"
        mode: "0644"
      loop: "{{ topology | product(['metallb-operator.yaml.j2', 'metallb-config.yaml.j2', 'metallb-bgp.yaml.j2']) | list }}"
      loop_control:
        label: "{{ item.0.name }}/{{ item.1 }}"
      vars:
        cluster: "{{ item.0 }}"

    - name: Render LVM Storage + NFS-Ganesha + CNV (Day-2 storage + virtualization)
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/install/{{ item.1 }}"
        dest: "{{ out_dir }}/{{ item.0.name }}/{{ item.1 | replace('.j2', '') }}"
        mode: "0644"
      loop: "{{ topology | product(day2_storage_manifests) | list }}"
      loop_control:
        label: "{{ item.0.name }}/{{ item.1 }}"
      vars:
        cluster: "{{ item.0 }}"

    # Air-gapped Day-2 operators: the oc-mirror ImageSetConfiguration (host side)
    # and the CatalogSource + ImageDigestMirrorSet (cluster side). Only for a
    # disconnected cluster with ocp_minor set; otherwise operators pull online.
    - name: Render operator-mirror configs (disconnected air-gap)
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/install/{{ item.1 }}"
        dest: "{{ out_dir }}/{{ item.0.name }}/{{ item.1 | replace('.j2', '') }}"
        mode: "0644"
      loop: "{{ topology | product(['imageset-config.yaml.j2', 'operator-catalog.yaml.j2']) | list }}"
      loop_control:
        label: "{{ item.0.name }}/{{ item.1 }}"
      vars:
        cluster: "{{ item.0 }}"
      when:
        - item.0.disconnected | default(disconnected)
        - ocp_minor | default('') | length > 0

    - name: Render FRR config for the MetalLB BGP peer
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/frr/frr.conf.j2"
        dest: "{{ out_dir }}/{{ item.name }}/frr.conf"
        mode: "0644"
      loop: "{{ topology }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        cluster: "{{ item }}"

    - name: Copy FRR daemons file for the BGP peer
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname }}/templates/frr/daemons"
        dest: "{{ out_dir }}/{{ item.name }}/frr-daemons"
        mode: "0644"
      loop: "{{ topology }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Render HAProxy config (multi-node upi external load balancer)
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/install/haproxy.cfg.j2"
        dest: "{{ out_dir }}/{{ item.name }}/haproxy.cfg"
        mode: "0644"
      loop: "{{ topology }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        cluster: "{{ item }}"
      when: item.mode == 'upi' and not item.sno

    - name: Render IPI install-config.yaml (baremetal hosts with BMC)
      ansible.builtin.template:
        src: "{{ playbook_dir | dirname }}/templates/install/install-config.ipi.yaml.j2"
        dest: "{{ out_dir }}/{{ item.name }}/install-config.yaml"
        mode: "0600"
      loop: "{{ topology }}"
      loop_control:
        label: "{{ item.name }}"
      vars:
        cluster: "{{ item }}"
      when: item.mode == 'ipi'

    - name: Done
      ansible.builtin.debug:
        msg: >-
          Wrote configs for {{ topology | map(attribute='name') | join(', ') }}
          under {{ out_dir }}/.
