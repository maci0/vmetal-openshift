---
# Create libvirt networks, volumes, and VMs for every cluster in `clusters`.
# Topology (subnets, MACs, bridges, VIPs) is derived, see group_vars/all.yml.
# Idempotent: re-running only creates what is missing.
#
#   ansible-playbook setup.yml            # qemu:///system (needs root)
#   ansible-playbook setup.yml -K         # prompt for sudo if not in libvirt group
#
- name: Provision virtual baremetal OCP lab
  hosts: local
  gather_facts: false
  become: "{{ use_become | default(true) }}"

  tasks:
    - name: Validate cluster definitions
      ansible.builtin.import_tasks: tasks/validate.yml

    - name: Build topology from addressing scheme
      ansible.builtin.set_fact:
        topology: "{{ lookup('template', 'templates/topology.yml.j2') | from_yaml }}"

    - name: Detect OVMF firmware paths
      ansible.builtin.import_tasks: tasks/detect_ovmf.yml

    - name: Host preflight (kvm, OVMF, nested virt)
      ansible.builtin.import_tasks: tasks/preflight.yml

    - name: Ensure storage pool is active
      community.libvirt.virt_pool:
        name: "{{ storage_pool }}"
        state: active
        uri: "{{ libvirt_uri }}"

    - name: List existing libvirt networks
      community.libvirt.virt_net:
        command: list_nets
        uri: "{{ libvirt_uri }}"
      register: existing_nets

    - name: Define networks (when absent)
      community.libvirt.virt_net:
        command: define
        name: "{{ item.1.name }}"
        xml: "{{ lookup('template', 'templates/libvirt/network.xml.j2') }}"
        uri: "{{ libvirt_uri }}"
      loop: "{{ topology | subelements('networks') }}"
      loop_control:
        label: "{{ item.1.name }}"
      vars:
        net: "{{ item.1 }}"
      when: item.1.name not in existing_nets.list_nets

    - name: Start networks and enable autostart
      community.libvirt.virt_net:
        name: "{{ item.1.name }}"
        state: active
        autostart: true
        uri: "{{ libvirt_uri }}"
      loop: "{{ topology | subelements('networks') }}"
      loop_control:
        label: "{{ item.1.name }}"

    - name: Check which node volumes already exist
      ansible.builtin.command:
        cmd: >-
          virsh -c {{ libvirt_uri }} vol-info --pool {{ storage_pool }}
          {{ item.0.fullname }}-{{ item.1.suffix }}.qcow2
      loop: "{{ topology | map(attribute='nodes') | flatten | subelements('disks') }}"
      loop_control:
        label: "{{ item.0.fullname }}-{{ item.1.suffix }}"
      register: volinfo
      changed_when: false
      failed_when: false

    - name: Create missing node volumes
      ansible.builtin.command:
        cmd: >-
          virsh -c {{ libvirt_uri }} vol-create-as {{ storage_pool }}
          {{ item.item.0.fullname }}-{{ item.item.1.suffix }}.qcow2
          {{ item.item.1.capacity_gib }}G --format qcow2
      loop: "{{ volinfo.results }}"
      loop_control:
        label: "{{ item.item.0.fullname }}-{{ item.item.1.suffix }}"
      when: item.rc != 0
      changed_when: true

    - name: Define domains
      community.libvirt.virt:
        command: define
        xml: "{{ lookup('template', 'templates/libvirt/domain.xml.j2') }}"
        uri: "{{ libvirt_uri }}"
      loop: "{{ topology | subelements('nodes') }}"
      loop_control:
        label: "{{ item.1.fullname }}"
      vars:
        cluster: "{{ item.0 }}"
        node: "{{ item.1 }}"

    # Only auto-start for boot_via=iso (the ISO is attached). For redfish / IPI
    # the nodes stay off until the BMC powers them on with virtual media.
    - name: Start domains (boot_via=iso clusters)
      community.libvirt.virt:
        name: "{{ item.1.fullname }}"
        state: running
        uri: "{{ libvirt_uri }}"
      loop: "{{ topology | subelements('nodes') }}"
      loop_control:
        label: "{{ item.1.fullname }}"
      when: item.0.static_iso
