---
# Auto-detect OVMF (UEFI) firmware. Skipped if ovmf_code AND ovmf_vars are set
# explicitly in group_vars/all.yml. Secure-boot variants are preferred.
# Covers Arch/CachyOS, Fedora, RHEL/CentOS, Debian/Ubuntu, openSUSE.
- name: Auto-detect OVMF firmware pair
  when: (ovmf_code | default('')) == '' or (ovmf_vars | default('')) == ''
  block:
    - name: Candidate OVMF pairs (secure-boot first)
      ansible.builtin.set_fact:
        ovmf_candidates:
          # Arch / CachyOS
          - { code: /usr/share/edk2/x64/OVMF_CODE.secboot.4m.fd, vars: /usr/share/edk2/x64/OVMF_VARS.4m.fd }
          - { code: /usr/share/edk2/x64/OVMF_CODE.4m.fd, vars: /usr/share/edk2/x64/OVMF_VARS.4m.fd }
          # Fedora
          - { code: /usr/share/edk2/ovmf/OVMF_CODE.secboot.fd, vars: /usr/share/edk2/ovmf/OVMF_VARS.fd }
          - { code: /usr/share/edk2/ovmf/OVMF_CODE.fd, vars: /usr/share/edk2/ovmf/OVMF_VARS.fd }
          # RHEL / CentOS Stream
          - { code: /usr/share/OVMF/OVMF_CODE.secboot.fd, vars: /usr/share/OVMF/OVMF_VARS.fd }
          # Debian / Ubuntu (4M, then legacy)
          - { code: /usr/share/OVMF/OVMF_CODE_4M.secboot.fd, vars: /usr/share/OVMF/OVMF_VARS_4M.fd }
          - { code: /usr/share/OVMF/OVMF_CODE_4M.fd, vars: /usr/share/OVMF/OVMF_VARS_4M.fd }
          - { code: /usr/share/OVMF/OVMF_CODE.fd, vars: /usr/share/OVMF/OVMF_VARS.fd }
          # openSUSE
          - { code: /usr/share/qemu/ovmf-x86_64-code.bin, vars: /usr/share/qemu/ovmf-x86_64-vars.bin }

    - name: Pick the first pair whose CODE and VARS both exist
      ansible.builtin.set_fact:
        ovmf_code: "{{ item.code }}"
        ovmf_vars: "{{ item.vars }}"
      when:
        - (ovmf_code | default('') == '') or (ovmf_vars | default('') == '')
        - item.code is exists
        - item.vars is exists
      loop: "{{ ovmf_candidates }}"
      loop_control:
        label: "{{ item.code }}"

    - name: Fail if no OVMF firmware was found
      ansible.builtin.assert:
        that:
          - ovmf_code | default('') != ''
          - ovmf_vars | default('') != ''
        fail_msg: "No OVMF CODE+VARS pair found. Install edk2/OVMF, or set both ovmf_code and ovmf_vars."
        quiet: true

- name: Show OVMF firmware in use
  ansible.builtin.debug:
    msg: "OVMF CODE={{ ovmf_code }} VARS={{ ovmf_vars }}"
