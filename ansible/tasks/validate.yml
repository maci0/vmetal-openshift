---
# Sanity-check the `clusters` input before doing any work.
- name: Validate cluster names are unique
  ansible.builtin.assert:
    that:
      - (clusters | map(attribute='name') | list | unique | length) == (clusters | length)
    fail_msg: "duplicate cluster name in `clusters`: {{ clusters | map(attribute='name') | list }}."
    quiet: true

# Effective index = pinned subnet_index, else the cluster's list position. A
# collision (pinned vs another cluster's auto position) reuses subnets/MACs/UUIDs.
- name: Compute effective cluster indices
  ansible.builtin.set_fact:
    eff_idx: "{{ (eff_idx | default([])) + [item.subnet_index | default(idx)] }}"
  loop: "{{ clusters }}"
  loop_control:
    index_var: idx
    label: "{{ item.name }}"

- name: Validate effective cluster indices are unique
  ansible.builtin.assert:
    that: (eff_idx | map('int') | unique | list | length) == (clusters | length)
    fail_msg: >-
      subnet_index collision (effective indices {{ eff_idx }}): a pinned subnet_index
      matches another cluster's auto-assigned list position. Pin all clusters or none.
    quiet: true

- name: Validate non-negative node counts + masters_schedulable value
  ansible.builtin.assert:
    that:
      - (item.workers | default(0) | int) >= 0
      - (item.day2_workers | default(0) | int) >= 0
      - (item.masters_schedulable | default('auto')) in ['auto', true, false]
    fail_msg: >-
      cluster '{{ item.name }}': workers/day2_workers must be >= 0 and
      masters_schedulable must be auto|true|false (got workers={{ item.workers | default(0) }},
      day2_workers={{ item.day2_workers | default(0) }},
      masters_schedulable={{ item.masters_schedulable | default('auto') }}).
    quiet: true
  loop: "{{ clusters }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate control-plane size (1 for single-node, or 3 for an HA etcd quorum)
  ansible.builtin.assert:
    that:
      - (item.control_plane | default(control_plane_count_default) | int) in [1, 3]
    fail_msg: >-
      cluster '{{ item.name }}': control_plane must be 1 (single-node, the one node
      is the control plane) or 3 (HA etcd quorum). Got
      {{ item.control_plane | default(control_plane_count_default) }}. 2 has no valid
      quorum; 5+ control-plane nodes are not supported here.
    quiet: true
  loop: "{{ clusters }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate workers (single-node has no install-time workers; use day2_workers)
  ansible.builtin.assert:
    that:
      - (item.control_plane | default(control_plane_count_default) | int) == 3 or (item.workers | default(0) | int) == 0
    fail_msg: >-
      cluster '{{ item.name }}': a single control-plane node (control_plane 1) cannot
      have install-time workers. Set workers 0, or use day2_workers: N for an
      edge-style single control plane with workers joined after install.
    quiet: true
  loop: "{{ clusters }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate install_mode
  ansible.builtin.assert:
    that:
      - (item.install_mode | default(install_mode)) in ['agent', 'ipi', 'upi']
    fail_msg: >-
      cluster '{{ item.name }}': install_mode must be agent, ipi, or upi (got
      '{{ item.install_mode | default(install_mode) }}').
    quiet: true
  loop: "{{ clusters }}"
  loop_control:
    label: "{{ item.name }}"

# IPI baremetal requires VIPs + an etcd quorum; single-node (control_plane 1) has
# neither and the installer rejects platform: baremetal for it. Use agent for SNO.
- name: Validate IPI is not single-node
  ansible.builtin.assert:
    that:
      - (item.install_mode | default(install_mode)) != 'ipi' or
        (item.control_plane | default(control_plane_count_default) | int) == 3
    fail_msg: >-
      cluster '{{ item.name }}': install_mode ipi requires control_plane 3
      (IPI baremetal has no single-node form here). Use install_mode agent for SNO.
    quiet: true
  loop: "{{ clusters }}"
  loop_control:
    label: "{{ item.name }}"

# Multi-node upi uses a transient bootstrap node + an external (host) HAProxy and
# is netboot-only here, so it requires boot_via: pxe. Single-node upi works with
# either boot method (ISO embed or pxe).
- name: Validate multi-node upi uses pxe
  ansible.builtin.assert:
    that:
      - (item.install_mode | default(install_mode)) != 'upi' or
        (item.control_plane | default(control_plane_count_default) | int) == 1 or
        (item.boot_via | default(boot_via)) == 'pxe'
    fail_msg: >-
      cluster '{{ item.name }}': multi-node install_mode upi requires boot_via: pxe
      (the ISO/Redfish path is single-node only). Set boot_via: pxe, or use
      control_plane 1 for single-node upi.
    quiet: true
  loop: "{{ clusters }}"
  loop_control:
    label: "{{ item.name }}"
