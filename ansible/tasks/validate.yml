---
# Sanity-check the `clusters` input before doing any work.
- name: Validate node counts (OpenShift needs 1 for SNO, or >= 3)
  ansible.builtin.assert:
    that:
      - (item.node_count | default(1) | int) == 1 or (item.node_count | default(1) | int) >= 3
    fail_msg: >-
      cluster '{{ item.name }}': node_count must be 1 (single-node) or >= 3
      (got {{ item.node_count | default(1) }}). A 2-node cluster has no valid
      control-plane topology.
    quiet: true
  loop: "{{ clusters }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate control-plane count (1 or 3, and <= node_count)
  ansible.builtin.assert:
    that:
      - (item.node_count | default(1) | int) == 1 or (item.control_plane_count | default(control_plane_count_default) | int) == 3
    fail_msg: >-
      cluster '{{ item.name }}': OpenShift needs an etcd quorum. Use node_count 1
      (single-node, control plane = the one node), or a 3-member control plane with
      workers (node_count >= 3, control_plane_count 3, workers = node_count - 3). A
      single control-plane node with separate workers is not a valid topology.
    quiet: true
  loop: "{{ clusters }}"
  loop_control:
    label: "{{ item.name }}"
