---
# Sanity-check the `clusters` input before doing any work.
- name: Validate node counts (OpenShift needs 1 for SNO, or >= 3)
  ansible.builtin.assert:
    that:
      - (item.node_count | default(1) | int) == 1 or (item.node_count | default(1) | int) >= 3
    fail_msg: >-
      cluster '{{ item.name }}': node_count must be 1 (single-node) or >= 3
      (got {{ item.node_count | default(1) }}). A 2-node cluster has no valid
      control-plane topology.
    quiet: true
  loop: "{{ clusters }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate control-plane count (1 or 3, and <= node_count)
  ansible.builtin.assert:
    that:
      - (item.node_count | default(1) | int) == 1 or (item.control_plane_count | default(control_plane_count_default) | int) in [1, 3]
      - (item.node_count | default(1) | int) == 1 or (item.control_plane_count | default(control_plane_count_default) | int) <= (item.node_count | int)
    fail_msg: >-
      cluster '{{ item.name }}': control_plane_count must be 1 or 3 and not exceed
      node_count.
    quiet: true
  loop: "{{ clusters }}"
  loop_control:
    label: "{{ item.name }}"
