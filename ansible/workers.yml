---
# Day-2 workers for an existing cluster. Provisions (or removes) the extra worker
# VMs defined by a cluster's `day2_workers` count. The join itself (build a node
# image, boot it, approve CSRs) is driven by scripts/workers-add.sh; this playbook
# only handles the libvirt side and renders nodes-config.yaml.
#
#   ansible-playbook workers.yml -e cluster_name=cluster0 -e worker_action=add
#   ansible-playbook workers.yml -e cluster_name=cluster0 -e worker_action=remove
#
# The networks already exist (created at install time) and are left untouched.
- name: Day-2 worker VMs
  hosts: local
  gather_facts: false
  become: "{{ use_become | default(true) }}"
  # cluster_name (not `cluster`) is the CLI arg: the nodes-config template binds
  # `cluster` to the topology dict, and an `-e cluster=` extra-var would outrank
  # that task var.
  vars:
    cluster_name: cluster0
    worker_action: add
  tasks:
    - name: Build topology from addressing scheme
      ansible.builtin.set_fact:
        topology: "{{ lookup('template', 'templates/topology.yml.j2') | from_yaml }}"

    - name: Select target cluster
      ansible.builtin.set_fact:
        tgt: "{{ topology | selectattr('name', 'equalto', cluster_name) | first }}"

    - name: Require day2_workers to be defined
      ansible.builtin.assert:
        that: tgt.day2_workers | default([]) | length > 0
        fail_msg: "cluster '{{ cluster_name }}' has no day2_workers; set day2_workers: N in group_vars."
        quiet: true

    - name: Add day-2 workers
      when: worker_action == 'add'
      block:
        - name: Detect OVMF firmware paths
          ansible.builtin.import_tasks: tasks/detect_ovmf.yml

        - name: Render nodes-config.yaml for the agent node-image
          ansible.builtin.copy:
            content: "{{ lookup('template', 'templates/install/nodes-config.yaml.j2') }}"
            dest: "{{ playbook_dir }}/../build/nodes-config-{{ cluster_name }}.yaml"
            mode: "0644"
          vars:
            cluster: "{{ tgt }}"

        - name: Create worker volumes (idempotent; skips any that already exist)
          community.libvirt.virt_volume:
            command: create
            pool: "{{ storage_pool }}"
            name: "{{ item.0.fullname }}-{{ item.1.suffix }}.qcow2"
            xml: >-
              <volume><name>{{ item.0.fullname }}-{{ item.1.suffix }}.qcow2</name>
              <capacity unit="G">{{ item.1.capacity_gib }}</capacity>
              <target><format type="qcow2"/></target></volume>
            uri: "{{ libvirt_uri }}"
          loop: "{{ tgt.day2_workers | subelements('disks') }}"
          loop_control:
            label: "{{ item.0.fullname }}-{{ item.1.suffix }}"

        - name: Define worker domains
          community.libvirt.virt:
            command: define
            xml: "{{ lookup('template', 'templates/libvirt/domain.xml.j2') }}"
            uri: "{{ libvirt_uri }}"
          loop: "{{ tgt.day2_workers }}"
          loop_control:
            label: "{{ item.fullname }}"
          vars:
            cluster: "{{ tgt }}"
            node: "{{ item }}"

    - name: Remove day-2 workers
      when: worker_action == 'remove'
      block:
        - name: Check which worker domains exist
          community.libvirt.virt:
            command: status
            name: "{{ item.fullname }}"
            uri: "{{ libvirt_uri }}"
          loop: "{{ tgt.day2_workers }}"
          loop_control:
            label: "{{ item.fullname }}"
          register: w_domstate
          changed_when: false
          failed_when: false

        - name: Destroy running worker domains
          community.libvirt.virt:
            name: "{{ item.item.fullname }}"
            state: destroyed
            uri: "{{ libvirt_uri }}"
          loop: "{{ w_domstate.results }}"
          loop_control:
            label: "{{ item.item.fullname }}"
          when: (item.status | default('')) == 'running'
          failed_when: false

        - name: Undefine worker domains (with nvram + storage)
          community.libvirt.virt:
            command: undefine
            name: "{{ item.item.fullname }}"
            flags:
              - nvram
              - delete_volumes
            uri: "{{ libvirt_uri }}"
          loop: "{{ w_domstate.results }}"
          loop_control:
            label: "{{ item.item.fullname }}"
          when: not (item.failed | default(false))
          failed_when: false
