<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350.2019999999998 133.8" width="1350.2019999999998" height="133.8" style="--bg:#ffffff;--fg:#1f2328;--line:#d1d9e0;--accent:#0969da;--muted:#59636e;background:var(--bg)">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <marker id="arrowhead" markerWidth="8" markerHeight="5" refX="7" refY="2.5" orient="auto">
    <polygon points="0 0, 8 2.5, 0 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
  <marker id="arrowhead-start" markerWidth="8" markerHeight="5" refX="1" refY="2.5" orient="auto-start-reverse">
    <polygon points="8 0, 0 2.5, 8 5" fill="var(--_arrow)" stroke="var(--_arrow)" stroke-width="0.75" stroke-linejoin="round" />
  </marker>
</defs>
<polyline class="edge" data-from="ram" data-to="ksm" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="253.862,66.9 301.86199999999997,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="ksm" data-to="wall" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="512.019,66.9 560.019,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="wall" data-to="squeeze" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="799.8159999999999,66.9 847.8159999999999,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<polyline class="edge" data-from="squeeze" data-to="zram" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="1050.5629999999999,66.9 1098.5629999999999,66.9" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
<g class="node" data-id="ram" data-label="VM guest RAM
(same RHCOS on every node)" data-shape="rectangle">
  <rect x="40" y="40" width="213.862" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="146.93099999999998" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="146.93099999999998" dy="-3.9000000000000012">VM guest RAM</tspan><tspan x="146.93099999999998" dy="16.900000000000002">(same RHCOS on every node)</tspan></text>
</g>
<g class="node" data-id="ksm" data-label="1. KSM dedup
identical pages -&gt; 1 CoW page" data-shape="rectangle">
  <rect x="301.86199999999997" y="40" width="210.15699999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="406.94049999999993" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="406.94049999999993" dy="-3.9000000000000012">1. KSM dedup</tspan><tspan x="406.94049999999993" dy="16.900000000000002">identical pages -&gt; 1 CoW page</tspan></text>
</g>
<g class="node" data-id="wall" data-label="2. cgroup wall
memory.high (per-VM, libvirt hook)" data-shape="rectangle">
  <rect x="560.019" y="40" width="239.79699999999994" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="679.9175" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="679.9175" dy="-3.9000000000000012">2. cgroup wall</tspan><tspan x="679.9175" dy="16.900000000000002">memory.high (per-VM, libvirt hook)</tspan></text>
</g>
<g class="node" data-id="squeeze" data-label="3. squeeze
reclaim coldest pages early" data-shape="rectangle">
  <rect x="847.8159999999999" y="40" width="202.74699999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="949.1895" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="949.1895" dy="-3.9000000000000012">3. squeeze</tspan><tspan x="949.1895" dy="16.900000000000002">reclaim coldest pages early</tspan></text>
</g>
<g class="node" data-id="zram" data-label="4. zram (zstd)
compress cold pages in RAM" data-shape="rectangle">
  <rect x="1098.5629999999999" y="40" width="211.63899999999998" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="1204.3825" y="66.9" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="1204.3825" dy="-3.9000000000000012">4. zram (zstd)</tspan><tspan x="1204.3825" dy="16.900000000000002">compress cold pages in RAM</tspan></text>
</g>
</svg>