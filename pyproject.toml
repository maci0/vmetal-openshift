# Tool config only: the helper scripts under tools/ and tests/ are run directly,
# not installed as a package.
[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["tools", "tests"]

# matplotlib ships no stubs.
[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true
